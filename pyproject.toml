[build-system]
requires = ["editables==0.5", "hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "alysis-code"
version = "0.13.3"
description = "Local CLI coding agent powered by any API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
  "agent",
  "cli",
  "coding-agent",
  "developer-tools",
  "llm",
  "api",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.0.0",
  "cryptography>=50.0.0",
  "ddgs>=9.0.0",
  "h2>=4.4.1",
  "httpcore>=1.0.0,<2.0.0",
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "packaging>=23.0",
  "pillow>=12.3.0",
  "platformdirs>=4.2.0",
  "pydantic>=2.6.0",
  "prompt-toolkit>=3.0.43",
  "rich>=13.7.1",
  "tiktoken>=0.7.0",
  "typer>=0.12.0",
  "websockets>=15.0,<17.0",
]

[project.urls]
Changelog = "https://github.com/AlysisAi/alysis-code/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/AlysisAi/alysis-code/tree/main/docs"
Funding = "https://github.com/sponsors/AlysisAi"
Issues = "https://github.com/AlysisAi/alysis-code/issues"
Security = "https://github.com/AlysisAi/alysis-code/blob/main/.github/SECURITY.md"
Source = "https://github.com/AlysisAi/alysis-code"

[project.optional-dependencies]
dev = [
  "editables==0.5",
  "hatchling==1.31.0",
  "pyyaml>=6.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
managed-build = [
  "pyinstaller==6.21.0",
  "pyinstaller-hooks-contrib==2026.6",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
# Canonical command.
alysis-code = "alysis_code.cli:app"
# Short alias.
alysis = "alysis_code.cli:app"
# Deprecated alias kept so muscle memory, shell aliases, CI scripts and IDE
# configs written against the old name keep working. Forwards silently.
# Remove no earlier than the next major release.
sylliptor = "alysis_code.cli:legacy_app"

[tool.hatch.build.targets.wheel]
packages = ["src/alysis_code"]
exclude = [
  "**/__pycache__/**",
  "**/*.py[cod]",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/docs/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/src/alysis_code",
]
exclude = [
  "**/__pycache__/**",
  "**/*.py[cod]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture=sys"
pythonpath = ["src", "."]
markers = [
    "smoke: portable mock-provider end-to-end build smoke across execution modes (pytest -m smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
