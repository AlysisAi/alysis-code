name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go for the pinned workflow linter
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.4"
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    name: test (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"python-version":"3.11"}
          - {"python-version":"3.12"}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Sync locked test dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}" --extra dev

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Format check
        run: uv run --frozen --no-sync ruff format --check .

      - name: Test
        run: uv run --frozen --no-sync pytest -q

  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Sync locked smoke dependencies
        run: uv sync --frozen --python "3.12" --extra dev

      - name: Smoke test CLI
        run: |
          uv run --frozen --no-sync alysis --help
          uv run --frozen --no-sync alysis --version

  uv-project-workflow:
    name: uv project workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Verify built-in AgentBox integration and project resolution
        run: uv run --frozen --extra dev python -m pytest tests/test_agentbox_integration.py -q

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - workflow-lint
      - test
      - macos-smoke
      - uv-project-workflow

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Install frozen build dependencies
        run: uv sync --frozen --no-editable --extra dev

      - name: Build deterministic distributions from the frozen environment
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --clear --no-create-gitignore --no-build-isolation --no-sources --out-dir dist/python

      - name: Validate archive identity, inventory, and clean installation
        run: >-
          uv run --frozen --no-sync python
          scripts/release/validate_python_distributions.py dist/python

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error
